<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatcher V2 — JSON Editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsoneditor@9.10.4/dist/jsoneditor.min.css">
<style>
:root{--bg:#070b16;--panel:#0c1324;--panel2:#101c35;--border:#1b2e54;--text:#cdd6f4;--dim:#6b7da4;--blue:#89b4fa;--green:#a6e3a1;--yellow:#f9e2af;--red:#f38ba8;--teal:#94e2d5}*{box-sizing:border-box}body{margin:0;height:100vh;background:var(--bg);color:var(--text);font-family:Segoe UI,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}header{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:14px;align-items:center}.logo{font-family:monospace;font-weight:800;letter-spacing:4px;color:var(--blue)}.muted{color:var(--dim);font-size:12px}.tabs,.bar,.quick{display:flex;gap:8px;align-items:center;background:var(--panel);border-bottom:1px solid var(--border);padding:8px 12px}.tab,.btn{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;padding:7px 12px;cursor:pointer;font-family:inherit}.tab.active,.btn.primary{border-color:var(--blue);color:var(--blue);background:#0e1c3a}.btn.good{border-color:var(--green);color:var(--green)}.btn.warn{border-color:var(--yellow);color:var(--yellow)}.btn:hover{background:var(--panel2)}#status{flex:1;color:var(--dim);font-family:monospace;font-size:12px}.quick{background:var(--panel2)}.quick .label{color:var(--dim);font-size:12px}#editor{flex:1;min-height:0}.jsoneditor{border:0!important}.jsoneditor-menu{background:var(--panel2)!important;border-bottom:1px solid var(--border)!important}.jsoneditor-statusbar{background:var(--panel)!important;color:var(--dim)!important;border-top:1px solid var(--border)!important}#validation{max-height:210px;overflow:auto;border-top:1px solid var(--border);background:var(--panel);display:none}.val-head{padding:8px 12px;font-family:monospace;font-weight:bold;border-bottom:1px solid var(--border)}.item{padding:6px 12px;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}.error{color:var(--red)}.warn{color:var(--yellow)}.info{color:var(--teal)}.ok{color:var(--green)}
</style>
</head>
<body>
<header><span class="logo">DISPATCHER</span><span>JSON Editor V2</span><span class="muted">cases[] + scenes + assets</span></header>
<div class="tabs"><button id="tab-story" class="tab active" onclick="switchTab('story')">📖 Story</button><button id="tab-assets" class="tab" onclick="switchTab('assets')">🎨 Assets</button><span id="status">Cargando...</span><button class="btn" onclick="loadBoth()">🔄 Auto-cargar</button><button class="btn" onclick="pickFile()">📂 Cargar</button><input id="file" type="file" accept=".json" hidden onchange="filePicked(event)"></div>
<div id="quick" class="quick"><span class="label">insertar →</span><button class="btn primary" onclick="addCase()">+ Caso</button><button class="btn" onclick="addScene()">+ Escena</button><button class="btn" onclick="addDialogue()">+ Diálogo</button><button class="btn" onclick="addInput()">+ Input</button><button class="btn" onclick="addTool()">+ Búsqueda</button><button class="btn" onclick="addChoice()">+ Decisión</button><button class="btn" onclick="addVignette()">+ Viñeta</button></div>
<div id="editor"></div>
<div class="bar"><button class="btn primary" onclick="validate()">✅ Validar</button><button class="btn good" onclick="download()">⬇ Descargar</button><button class="btn warn" onclick="copyJson()">📋 Copiar</button><span class="muted">Para auto-cargar: python -m http.server 8080 desde la raíz del proyecto</span></div>
<div id="validation"><div id="vhead" class="val-head"></div><div id="vlist"></div></div>
<script src="https://cdn.jsdelivr.net/npm/jsoneditor@9.10.4/dist/jsoneditor.min.js"></script>
<script>
const S={tab:'story',story:null,assets:null}; let editor;
function schema(){return S.tab==='story'?{type:'object',required:['start','scenes'],properties:{start:{type:'string'},cases:{type:'array'},scenes:{type:'array'},manual_categories:{type:'array'}}}:{type:'object',properties:{audio:{type:'object'},vignettes:{type:'object'},cinema:{type:'object'},contacts:{type:'object'}}}}
function build(){if(editor)editor.destroy();editor=new JSONEditor(document.getElementById('editor'),{mode:'tree',modes:['tree','code','view'],schema:schema(),enableSort:false,enableTransform:false}); const data=S.tab==='story'?S.story:S.assets; if(data)editor.set(data)}
function sync(){try{const d=editor.get(); if(S.tab==='story')S.story=d; else S.assets=d; return d}catch(e){alert('JSON inválido: '+e.message); return null}}
function switchTab(t){sync();S.tab=t;document.getElementById('tab-story').classList.toggle('active',t==='story');document.getElementById('tab-assets').classList.toggle('active',t==='assets');document.getElementById('quick').style.display=t==='story'?'flex':'none';build();status('Editando '+(t==='story'?'dispatcher_story.json':'dispatcher_assets.json'))}
async function loadJson(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(url+' '+r.status);return await r.json()}
async function loadBoth(){try{S.story=await loadJson('../data/dispatcher_story.json');S.assets=await loadJson('../data/dispatcher_assets.json');build();status('JSON cargados desde /data')}catch(e){status('Auto-carga falló. Usa servidor local o carga manual. '+e.message)}}
function pickFile(){document.getElementById('file').click()}
function filePicked(e){const f=e.target.files[0]; if(!f)return; const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result); if(S.tab==='story')S.story=j; else S.assets=j; build();status('Archivo cargado: '+f.name)}catch(err){alert('JSON inválido: '+err.message)}};r.readAsText(f);e.target.value=''}
function status(t){document.getElementById('status').textContent=t}
function scenes(){return (S.story?.scenes||[])} function cases(){return (S.story?.cases||[])} function caseById(id){return cases().find(c=>c.id===id)} function sceneById(id){return scenes().find(s=>s.id===id)}
function ask(msg,def=''){const v=prompt(msg,def);return v===null?null:v.trim()}
function addCase(){const d=sync(); if(!d)return; d.cases=d.cases||[]; const id=ask('ID del caso','case_02'); if(!id)return; d.cases.push({id,title:ask('Título del caso','Caso nuevo')||id,description:'',start_scene:'',initial_facts:{local:'—',address:'—',plate:'—',vehicle:'—',dispatch:'—'},case_fields:{},tool_search:{},dispatch_rules:{case_title:'Caso nuevo',available_units:[{id:'Carabineros',icon:'🚔',desc:'Patrulla'},{id:'Ambulancia',icon:'🚑',desc:'Emergencia médica'},{id:'Bomberos',icon:'🚒',desc:'Incendio / rescate'}],required_units:[],next:null,outcomes:[{id:'complete',match:'all_required',notification:'UNIDADES DESPACHADAS',beats:[]},{id:'wrong',match:'fallback',notification:'DESPACHO INCOMPLETO',beats:[]}]}});editor.set(d);status('Caso creado: '+id)}
function addScene(){const d=sync(); if(!d)return; d.scenes=d.scenes||[]; const id=ask('ID escena','scene_'+(d.scenes.length+1)); if(!id)return; const case_id=ask('case_id opcional. Vacío = escena global',cases()[0]?.id||'')||undefined; d.scenes.push({id,title:ask('Título','Nueva escena')||id,channel:ask('channel: narration / 911 / whatsapp','narration')||'narration',case_id,beats:[],choices:[],next:null}); if(case_id&&caseById(case_id)&&!caseById(case_id).start_scene)caseById(case_id).start_scene=id; editor.set(d);status('Escena creada: '+id)}
function targetScene(){const id=ask('ID de escena destino',scenes().at(-1)?.id||'');return id&&sceneById(id)}
function addDialogue(){const d=sync(); if(!d)return; const s=targetScene(); if(!s)return alert('Escena no encontrada'); const speaker=ask('speaker vacío = narración. Ej: ERIC, MENSAJE, DANI','ERIC'); const text=ask('Texto',''); if(!text)return; s.beats=s.beats||[]; s.beats.push(speaker?{speaker,text}:{kind:'narration',text}); editor.set(d);status('Diálogo agregado a '+s.id)}
function addInput(){const d=sync(); if(!d)return; const s=targetScene(); if(!s)return alert('Escena no encontrada'); const field=ask('field','plate'); if(!field)return; const setValue=ask('Valor a registrar','TVBA-20')||''; const answer=ask('Respuesta mínima aceptada','tvba')||''; const hint=ask('Hint para jugador','Anota el dato')||''; s.beats=s.beats||[]; s.beats.push({kind:'input',field,setValue,answer,hint}); const c=caseById(s.case_id); if(c){c.case_fields=c.case_fields||{}; if(!c.case_fields[field]) c.case_fields[field]={factPath:'facts.'+field,logTemplate:'✔ '+field+': {value}',notificationLabel:field.toUpperCase()+' REGISTRADO'}} editor.set(d);status('Input agregado y case_field creado si faltaba')}
function addTool(){const d=sync(); if(!d)return; const s=targetScene(); if(!s)return alert('Escena no encontrada'); const tool=ask('tool key','address'); if(!tool)return; s.beats=s.beats||[]; s.beats.push({kind:'tool-search',tool}); const c=caseById(s.case_id); if(c){c.tool_search=c.tool_search||{}; if(!c.tool_search[tool]) c.tool_search[tool]={title:'Buscador '+tool,hint:'Configura esta búsqueda',placeholder:'Buscar...',match_patterns:[],result:{name:'Resultado',address:'',description:'',setFacts:{},mapLog:'',notificationLabel:'DATO CONFIRMADO',notificationValue:'OK'}}} editor.set(d);status('Búsqueda agregada y tool_search creado si faltaba')}
function addChoice(){const d=sync(); if(!d)return; const s=targetScene(); if(!s)return alert('Escena no encontrada'); s.choices=s.choices||[]; s.choices.push({at:Number(ask('Mostrar después del beat número','1')||1),prompt:ask('Pregunta','¿Qué haces?')||'¿Qué haces?',options:[{label:ask('Opción 1','Opción A')||'Opción A',beats:[],goto:ask('goto opción 1','')||undefined},{label:ask('Opción 2','Opción B')||'Opción B',beats:[],goto:ask('goto opción 2','')||undefined}]});editor.set(d);status('Decisión agregada a '+s.id)}
function addVignette(){const d=sync(); if(!d)return; const s=targetScene(); if(!s)return alert('Escena no encontrada'); const key=ask('Clave viñeta','new_vignette'); if(!key)return; s.beats=s.beats||[]; s.beats.push({kind:'vignette',scene:key}); if(S.assets){S.assets.vignettes=S.assets.vignettes||{}; if(!S.assets.vignettes[key]) S.assets.vignettes[key]={image:'assets/vignettes/'+key+'.png',label:key.toUpperCase(),subtitle:''}} editor.set(d);status('Viñeta agregada. Revisa tab Assets para la imagen.')}
function validate(){const d=sync(); if(!d)return; const errs=[],warn=[]; if(S.tab==='assets'){ if(S.assets?.whatsapp?.default_contact && !S.assets?.contacts?.[S.assets.whatsapp.default_contact]) errs.push('whatsapp.default_contact no existe en contacts'); showVal(errs,warn); return }
const ids=new Set(scenes().map(s=>s.id)); const cids=new Set(cases().map(c=>c.id)); if(!ids.has(S.story.start))errs.push('start apunta a escena inexistente: '+S.story.start); scenes().forEach(s=>{ if(s.next && !ids.has(s.next))errs.push(s.id+'.next inválido: '+s.next); if(s.case_id && !cids.has(s.case_id))errs.push(s.id+'.case_id inválido: '+s.case_id); (s.choices||[]).forEach(ch=>(ch.options||[]).forEach(o=>{if(o.goto&&!ids.has(o.goto))errs.push(s.id+'.goto inválido: '+o.goto)})); const c=caseById(s.case_id)||{}; const fields={...(S.story.case_fields||{}),...(c.case_fields||{})}; const tools={...(S.story.tool_search||{}),...(c.tool_search||{})}; function walk(bs){(bs||[]).forEach(b=>{if(b.kind==='input'&&!fields[b.field])warn.push(s.id+': input sin case_field '+b.field); if(b.kind==='tool-search'&&!tools[b.tool])errs.push(s.id+': tool-search sin definición '+b.tool); if(b.kind==='vignette'&&S.assets&&!S.assets.vignettes?.[b.scene])warn.push(s.id+': viñeta sin asset '+b.scene)})} walk(s.beats); (s.choices||[]).forEach(ch=>(ch.options||[]).forEach(o=>walk(o.beats))) }); showVal(errs,warn)}
function showVal(errs,warn){const p=document.getElementById('validation'),h=document.getElementById('vhead'),l=document.getElementById('vlist');p.style.display='block';h.className='val-head '+(errs.length?'error':warn.length?'warn':'ok');h.textContent=errs.length?errs.length+' errores':warn.length?warn.length+' advertencias':'Sin problemas';l.innerHTML=[...errs.map(e=>'<div class="item error">✕ '+esc(e)+'</div>'),...warn.map(w=>'<div class="item warn">⚠ '+esc(w)+'</div>')].join('')||'<div class="item ok">✔ JSON válido</div>'}
function download(){const d=sync(); if(!d)return; const text=JSON.stringify(d,null,2); const name=S.tab==='story'?'dispatcher_story.json':'dispatcher_assets.json'; const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=name; a.click(); URL.revokeObjectURL(a.href)}
async function copyJson(){const d=sync(); if(!d)return; await navigator.clipboard.writeText(JSON.stringify(d,null,2)); status('Copiado al portapapeles')}
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
build(); loadBoth();
</script>
</body>
</html>
