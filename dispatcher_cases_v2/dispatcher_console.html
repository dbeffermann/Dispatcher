<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DISPATCHER — Centro de Comunicaciones</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #070b16;
  --bg-panel:    #0c1324;
  --bg-panel2:   #101c35;
  --border:      #1b2e54;
  --border-hi:   #3d6bff;
  --text:        #cdd6f4;
  --text-dim:    #5a6e9a;
  --text-bright: #f2f6ff;
  --911:         #ff6b6b;
  --911-bg:      #1a0808;
  --911-border:  #5c1010;
  --narr:        #89b4fa;
  --green:       #a6e3a1;
  --green-bg:    #0e2018;
  --yellow:      #f9e2af;
  --yellow-bg:   #1c1600;
  --purple:      #cba6f7;
  --teal:        #94e2d5;
  --teal-bg:     #081e1a;
  --req:         #a6e3a1;
  --req-bg:      #0e2018;
  --req-glow:    rgba(166,227,161,0.35);
  --wp-sent:     #0f3320;
  --wp-recv:     #141e30;
  --wp-bg:       #080f0b;
}

html, body {
  height: 100%;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

body { display: flex; flex-direction: column; }

/* ── HEADER ─────────────────────────────────────────────── */
#header {
  display: flex;
  align-items: center;
  padding: 7px 20px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  gap: 20px;
  flex-shrink: 0;
  z-index: 10;
}
#hdr-logo {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-bright);
}
#hdr-scene {
  font-size: 12px;
  color: var(--text-dim);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* ── MAIN GRID ───────────────────────────────────────────── */
#main {
  display: grid;
  grid-template-columns: 36% 64%;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}

/* ── NARRATION PANEL (left) ──────────────────────────────── */
#narr-panel {
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#narr-label {
  display: none;
}
#narr-feed {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  scroll-behavior: smooth;
}
#narr-feed::-webkit-scrollbar { width: 3px; }
#narr-feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.n-scene   { color: var(--yellow); font-size: 11px; font-weight: bold; letter-spacing: 1px;
             text-transform: uppercase; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 4px; }
.n-line    { color: var(--text-dim); font-size: 13px; line-height: 1.6; font-style: normal; }
.n-prompt  { color: var(--narr); font-size: 13px; font-weight: bold; padding: 4px 0; }
.n-chosen  { color: var(--purple); font-size: 12px; }
.n-cue     { color: var(--green); font-size: 12px; font-weight: bold;
             background: var(--green-bg); border-left: 3px solid var(--green);
             padding: 5px 10px; border-radius: 0 5px 5px 0; }
.n-alert   { color: var(--911); font-size: 12px; font-weight: bold;
             background: var(--911-bg); border-left: 3px solid var(--911);
             padding: 5px 10px; border-radius: 0 5px 5px 0; }
.n-end     { color: var(--green); font-weight: bold; font-size: 13px; }

/* ── RIGHT SIDE ──────────────────────────────────────────── */
#right-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── MODULE BAR ──────────────────────────────────────────── */
#mod-bar {
  display: flex;
  gap: 5px;
  padding: 8px 12px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.mbtn {
  flex: 1;
  padding: 7px 4px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  cursor: pointer;
  border-radius: 5px;
  font-size: 12px;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mbtn:hover    { background: var(--bg-panel2); color: var(--text); border-color: var(--border-hi); }
.mbtn.active   { background: #0f2535; color: var(--teal); border-color: var(--teal); font-weight: bold; }
.mbtn.req-911  { border-color: var(--911); color: var(--911); animation: pulse-red 1.1s infinite; }
.mbtn.req-wp   { border-color: var(--green); color: var(--green); animation: pulse-green 1.1s infinite; }

@keyframes pulse-red   { 0%,100% { box-shadow: none; } 50% { box-shadow: 0 0 10px 2px rgba(255,107,107,.5); } }
@keyframes pulse-green  { 0%,100% { box-shadow: none; } 50% { box-shadow: 0 0 10px 2px var(--req-glow); } }
@keyframes pulse-update { 0%,100% { box-shadow: none; } 50% { box-shadow: 0 0 10px 2px rgba(203,166,247,.4); } }
.mbtn.req-update { border-color: var(--purple); color: var(--purple); animation: pulse-update 1.1s infinite; }

/* ── PANEL CONTENT ───────────────────────────────────────── */
#panel-content {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ─ 911 EMERGENCY ─ */
.ep-wrap { display: flex; flex-direction: column; height: 100%; font-family: 'Courier New', monospace; }
.ep-head {
  padding: 9px 16px;
  background: var(--911-bg);
  border-bottom: 1px solid var(--911-border);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--911);
  text-transform: uppercase;
  flex-shrink: 0;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--911); flex-shrink: 0; }
.dot.blink { animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
#e-feed {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
#e-feed::-webkit-scrollbar { width: 3px; }
#e-feed::-webkit-scrollbar-thumb { background: var(--911-border); border-radius: 2px; }
.el-in  { font-size: 13px; color: #ff9999; line-height: 1.5; }
.el-out { font-size: 13px; color: #88cc99; line-height: 1.5; }
.el-sys { font-size: 12px; color: var(--text-dim); font-style: italic; }
.el-bubble-in  { display:flex; flex-direction:column; align-items:flex-start; margin-bottom:8px; }
.el-bubble-out { display:flex; flex-direction:column; align-items:flex-end; margin-bottom:8px; }
.el-bname { font-size:10px; letter-spacing:1px; text-transform:uppercase; margin-bottom:3px; }
.el-bubble-in  .el-bname { color: var(--911); }
.el-bubble-out .el-bname { color: var(--green); }
.el-btext { font-family:'Courier New',monospace; font-size:13px; line-height:1.5;
            padding:8px 12px; border-radius:10px; max-width:88%; display:inline-block; }
.el-bubble-in  .el-btext { background:rgba(255,107,107,.14); color:#ffbbbb; border-bottom-left-radius:2px; }
.el-bubble-out .el-btext { background:rgba(166,227,161,.10); color:#a6e3a1; border-bottom-right-radius:2px; }
.el-speaker { font-size: 10px; color: var(--text-dim); margin-bottom: 1px; }

/* ─ WHATSAPP ─ */
.wp-wrap { display: flex; flex-direction: column; height: 100%; }
.wp-head {
  padding: 11px 16px;
  background: #0a1810;
  border-bottom: 1px solid #1a3a24;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.wp-av {
  width: 38px; height: 38px; border-radius: 50%;
  background: #25d366;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; color: #000; font-size: 17px;
  flex-shrink: 0;
}
.wp-name { font-weight: bold; font-size: 14px; color: var(--green); }
.wp-sub  { font-size: 11px; color: var(--text-dim); }
#wp-msgs {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--wp-bg);
}
#wp-msgs::-webkit-scrollbar { width: 3px; }
#wp-msgs::-webkit-scrollbar-thumb { background: #1a3a24; border-radius: 2px; }
.bubble {
  max-width: 78%;
  padding: 9px 13px;
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.55;
}
.bubble.sent { background: var(--wp-sent); align-self: flex-end; border-bottom-right-radius: 4px; color: #d5f5d5; }
.bubble.recv { background: var(--wp-recv); align-self: flex-start; border-bottom-left-radius: 4px; color: var(--text); }
.bubble-name { font-size: 10px; font-weight: bold; color: #25d366; margin-bottom: 3px; }
.bubble.sent .bubble-name { color: #7ef7be; text-align: right; }

/* ─ MANUAL ─ */
.mn-wrap { display: flex; flex-direction: column; height: 100%; }
.mn-nav {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  background: #252000;
  border-bottom: 1px solid #3e3200;
  gap: 8px;
  flex-shrink: 0;
}
.mn-btn {
  background: transparent;
  border: 1px solid #3e3200;
  color: var(--yellow);
  cursor: pointer;
  padding: 5px 14px;
  border-radius: 4px;
  font-size: 12px;
  font-family: inherit;
  transition: background 0.1s;
}
.mn-btn:hover { background: #312900; }
.mn-counter { flex: 1; text-align: center; font-size: 12px; color: var(--text-dim); }
.mn-card { flex: 1; overflow-y: auto; padding: 16px 18px; }
.mn-card::-webkit-scrollbar { width: 3px; }
.mn-card::-webkit-scrollbar-thumb { background: #3e3200; border-radius: 2px; }
.mn-name  { font-size: 19px; font-weight: bold; color: var(--yellow); margin-bottom: 5px; }
.mn-keys  { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.mn-key   { background: #252000; border: 1px solid #3e3200; padding: 5px 10px;
            border-radius: 999px; font-size: 11px; color: var(--yellow); cursor: pointer;
            transition: background 0.12s, color 0.12s, border-color 0.12s; }
.mn-key:hover { background: #312900; border-color: #5b4a00; }
.mn-key.active { background: var(--yellow-bg); border-color: var(--yellow); color: var(--text-bright); }
.mn-sec   { font-size: 10px; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--text-dim); margin: 14px 0 6px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.mn-step  { display: flex; gap: 9px; font-size: 13px; line-height: 1.55; padding: 3px 0; color: var(--text); }
.mn-num   { color: var(--yellow); font-weight: bold; min-width: 16px; }
.mn-avoid { font-size: 13px; color: #ff9999; padding: 2px 0; }
.mn-dispatch { background: #130f02; border: 1px solid #5a4a12; border-radius: 6px;
               padding: 10px 13px; margin-top: 14px; font-size: 13px; color: #f6d77e; }
.mn-idx   { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
.mn-idx-h { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
.mn-idx-item { font-size: 12px; padding: 4px 8px; border-radius: 4px; cursor: pointer; color: var(--text-dim); transition: background 0.1s; }
.mn-idx-item:hover  { background: var(--bg-panel2); color: var(--text); }
.mn-idx-item.active { background: #252000; color: var(--yellow); }
.mn-filterbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 2px 0 14px; }
.mn-filterlabel { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.4px; }
.mn-filterclear { background: transparent; border: 1px solid #3e3200; color: var(--yellow); padding: 4px 9px; border-radius: 999px; cursor: pointer; font-size: 11px; }
.mn-filterclear:hover { background: #312900; }
.mn-empty { padding: 18px 0; color: var(--text-dim); font-size: 13px; line-height: 1.6; }

/* ─ MAP ─ */
.mp-wrap { display: flex; flex-direction: column; height: 100%; }
.mp-head { padding: 10px 16px; background: #0b1422; border-bottom: 1px solid var(--border);
           font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--text-bright); text-transform: uppercase; flex-shrink: 0; }
.mp-shell { flex: 1; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; background: #080f0d; }
.mp-shell::-webkit-scrollbar { width: 3px; }
.mp-shell::-webkit-scrollbar-thumb { background: #0f2e26; border-radius: 2px; }
.mp-section { display: flex; flex-direction: column; gap: 8px; }
.mp-section-h { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.4px; }
.mp-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mp-fact { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px 11px; }
.mp-fact label { display: block; font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.mp-fact span  { font-size: 13px; color: var(--teal); font-family: inherit; line-height: 1.45; }
.mp-timeline { display: flex; flex-direction: column; gap: 8px; }
.mp-entry { background: #09111e; border: 1px solid #203354; border-left: 3px solid var(--teal); border-radius: 6px; padding: 9px 11px; }
.mp-entry-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.mp-entry-idx { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
.mp-entry-time { margin-left: auto; font-size: 10px; color: var(--text-dim); }
.mp-entry-text { font-size: 13px; color: var(--text-bright); line-height: 1.5; }
.mp-empty { padding: 12px 0; color: var(--text-dim); font-size: 13px; }
.mp-log { flex: 1; overflow-y: auto; padding: 10px 16px; }
.mp-log::-webkit-scrollbar { width: 3px; }
.mp-log::-webkit-scrollbar-thumb { background: #0f2e26; border-radius: 2px; }
.mp-event { font-size: 12px; color: var(--teal); font-family: monospace; padding: 4px 0;
            border-bottom: 1px solid #0a2018; }
.mp-event::before { content: '▶  '; opacity: 0.4; }

/* ─ DISPATCH ─ */
.dp-wrap { display: flex; flex-direction: column; gap: 14px; padding: 18px; height: 100%; overflow-y: auto; }
.dp-h    { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--purple); }
.dp-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 7px; padding: 12px 14px; }
.dp-lbl  { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.dp-val  { font-size: 15px; color: var(--purple); font-weight: bold; }
.dp-unit { background: var(--bg-panel2); border: 1px solid var(--border); border-radius: 6px;
           padding: 11px 14px; display: flex; align-items: center; gap: 11px; }
.dp-icon { font-size: 22px; }
.dp-uname { color: var(--text); font-weight: bold; font-size: 13px; }
.dp-status { margin-left: auto; font-size: 11px; color: var(--green); }
.dp-pending { margin-left: auto; font-size: 11px; color: var(--text-dim); }

/* ── BOTTOM BAR ──────────────────────────────────────────── */
#bottom {
  border-top: 1px solid var(--border);
  background: var(--bg-panel);
  padding: 10px 16px 11px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  flex-shrink: 0;
}
#action-row { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }

#btn-continue {
  flex: 1 1 100%;
  width: 100%;
  min-height: 52px;
  padding: 12px 20px;
  background: var(--req-bg);
  border: 1px solid var(--req);
  color: var(--req);
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  border-radius: 6px;
  font-family: inherit;
  letter-spacing: 2px;
  transition: all 0.15s;
}
#btn-continue:hover:not(:disabled) { background: #163026; }
#btn-continue.pulsing { animation: pulse-action 1.6s infinite; }
#btn-continue:disabled { opacity: 0.4; cursor: not-allowed; animation: none; }
@keyframes pulse-action {
  0%,100% { box-shadow: none; }
  50%      { box-shadow: 0 0 14px 3px var(--req-glow); }
}

.btn-choice {
  flex: 1 1 calc(50% - 4px);
  min-width: 0;
  padding: 11px 10px;
  background: var(--bg-panel2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  border-radius: 6px;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.btn-choice.live { border-color: var(--narr); color: var(--text-bright); background: #0e1c3a; animation: pulse-choice 1.2s infinite; }
.btn-choice:disabled { opacity: 0.3; cursor: not-allowed; animation: none; }
@keyframes pulse-choice {
  0%,100% { box-shadow: none; }
  50%      { box-shadow: 0 0 8px 2px rgba(137,180,250,.35); }
}
.input-wrap  { display: flex; gap: 8px; width: 100%; }
.inp-answer  {
  flex: 1; background: #060d1a; border: 1px solid var(--teal);
  color: var(--text-bright); padding: 10px 14px; border-radius: 5px;
  font-family: 'Courier New', monospace; font-size: 14px;
  outline: none; letter-spacing: .5px;
}
.inp-answer:focus { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(148,226,213,.2); }
.btn-submit {
  background: var(--teal); color: #0a0e1b; border: none;
  padding: 10px 18px; border-radius: 5px; cursor: pointer;
  font-family: inherit; font-size: 13px; font-weight: bold;
  letter-spacing: 1px; white-space: nowrap;
}
.btn-submit:hover { opacity: .85; }
.n-correct { color: #a6e3a1; font-size: 12px; padding-left: 4px; }
.action-input .btn-submit { min-width: 132px; }
/* ── PUSH NOTIFICATIONS ─────────────────────────────────────────────────── */
#notif-area {
  position: fixed;
  right: 14px;
  top: 56px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
  width: 210px;
}
.notif {
  background: #0b1526;
  border: 1px solid var(--teal);
  border-left: 3px solid var(--teal);
  border-radius: 5px;
  padding: 7px 11px;
  animation: notif-in .22s ease forwards;
  font-family: 'Courier New', monospace;
}
.notif-lbl {
  color: var(--teal);
  font-size: 9px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.notif-val {
  color: #e2e8f0;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .4px;
}
@keyframes notif-in {
  from { opacity: 0; transform: translateX(28px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes notif-out {
  from { opacity: 1; transform: translateX(0); }
  to   { opacity: 0; transform: translateX(28px); }
}
/* ── MAP TOOL PANELS ─────────────────────────────────────────────────── */
.tool-wrap { padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; }
.tool-hint { font-size: 11px; color: var(--text-dim); line-height: 1.5; }
.tool-search-row { display: flex; gap: 6px; }
.tool-search-inp { flex: 1; background: #060d1a; border: 1px solid #2a3a5c; color: var(--text-bright); padding: 9px 12px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 13px; outline: none; }
.tool-search-inp:focus { border-color: var(--teal); }
.tool-search-btn { background: transparent; border: 1px solid var(--teal); color: var(--teal); padding: 9px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; letter-spacing: .5px; white-space: nowrap; }
.tool-search-btn:hover { background: rgba(148,226,213,.1); }
.tool-result { background: #0d1b2a; border: 1px solid rgba(148,226,213,.3); border-radius: 5px; padding: 11px 13px; }
.tool-result-name { font-size: 14px; font-weight: bold; color: var(--text-bright); margin-bottom: 3px; }
.tool-result-addr { font-size: 12px; color: var(--teal); margin-bottom: 8px; }
.tool-confirm { background: var(--teal); color: #0a0e1b; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: bold; letter-spacing: 1px; width: 100%; }
.tool-confirm:hover { opacity: .85; }
.tool-no-result { font-size: 12px; color: #f38ba8; }
.model-list { display: flex; flex-direction: column; gap: 7px; }
.model-card { background: #0d1b2a; border: 1px solid #2a3a5c; border-radius: 5px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: border-color .15s; }
.model-card:hover { border-color: rgba(148,226,213,.4); }
.model-info { flex: 1; }
.model-name { font-size: 13px; font-weight: bold; color: var(--text-bright); }
.model-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.model-price { font-size: 11px; color: var(--teal); margin-top: 2px; }
.model-badge { font-size: 10px; color: #a6e3a1; margin-left: 6px; }

/* ── OPEN TOOL BUTTON (action-row) ─────────────────────────────────────── */
.btn-tool-open { background: transparent; border: 1.5px solid var(--teal); color: var(--teal); padding: 9px 18px; border-radius: 5px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: .5px; width: 100%; transition: background .15s; }
.btn-tool-open:hover { background: rgba(148,226,213,.08); }
/* ── MAP APP LAUNCHER ────────────────────────────────────────────────────── */
.map-apps { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 4px; }
.map-app-card { display: flex; align-items: center; gap: 12px; padding: 11px 13px; background: #060d1a; border: 1px solid #2a3a5c; border-radius: 6px; }
.map-app-card.required { border-color: var(--teal); cursor: pointer; }
.map-app-card.required:hover { background: #0a1f2a; }

.map-app-icon { font-size: 20px; flex-shrink: 0; }
.map-app-info { flex: 1; }
.map-app-name { font-size: 13px; color: var(--text-bright); font-family: 'Courier New', monospace; }
.map-app-desc { font-size: 10px; color: var(--text-dim); margin-top: 2px; line-height: 1.4; }
.map-app-badge { font-size: 9px; color: var(--teal); letter-spacing: 1px; padding: 2px 6px; border: 1px solid var(--teal); border-radius: 3px; white-space: nowrap; flex-shrink: 0; }
/* ── DISPATCH INTERACTIVE ────────────────────────────────────────────────── */
.dp-units-grid { display: flex; flex-direction: column; gap: 7px; margin: 8px 0 10px; }
.dp-unit-btn { display: flex; align-items: center; gap: 11px; padding: 9px 12px; background: #060d1a; border: 1px solid #2a3a5c; border-radius: 5px; cursor: pointer; transition: all .15s; }
.dp-unit-btn:hover { border-color: #3a4a6c; }

.dp-unit-desc { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.dp-check { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid #2a3a5c; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; }
.dp-unit-btn.selected .dp-check { border-color: var(--teal); background: var(--teal); color: #060d1a; font-weight: bold; }
.dp-confirm-btn { width: 100%; padding: 10px; background: transparent; border: 1.5px solid var(--teal); border-radius: 5px; color: var(--teal); font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: background .15s; }
.dp-confirm-btn:hover:not(:disabled) { background: rgba(148,226,213,.08); }

#status-bar {
  font-size: 11px;
  font-family: 'Courier New', monospace;

  min-height: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#status-bar.s-req   { color: var(--req); }

/* ── TOAST 911 ───────────────────────────────────────────── */
#toast {
  position: fixed;
  top: 52px;
  right: 16px;
  background: var(--911-bg);
  border: 2px solid var(--911);

  animation: slide-in 0.28s ease-out;
  box-shadow: 0 4px 24px rgba(255,107,107,.25);
}
#toast.show { display: block; }
@keyframes slide-in { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.toast-title { font-size: 10px; letter-spacing: 2px; color: var(--911); text-transform: uppercase;
               margin-bottom: 6px; display: flex; align-items: center; gap: 7px; }
.toast-text  { font-size: 13px; color: #ffaaaa; font-family: monospace; line-height: 1.5; }

.toast-hint:hover { color: var(--911); }

/* ── SCENE FADE ──────────────────────────────────────────── */
#fade {
  position: fixed; inset: 0;
  background: #000;
  z-index: 200;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.32s;
}
#fade.on { opacity: 1; }

/* ── KEYBOARD HINT ───────────────────────────────────────── */
#key-hint {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(12,19,36,.92);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 18px;
  font-size: 11px;
  color: var(--text-dim);
  z-index: 100;
  display: none;
  pointer-events: none;
  white-space: nowrap;
}
#key-hint span { color: var(--text); font-weight: bold; }
/* ── SOUND BUTTON ── */
#sound-btn { background:transparent; border:1px solid var(--border); color:var(--text-dim); padding:5px 10px; border-radius:4px; cursor:pointer; font-size:15px; flex-shrink:0; transition:color .15s,border-color .15s; }
#sound-btn:hover { color:var(--text); border-color:var(--teal); }
/* ── VIGNETTE OVERLAY (cinematic letterbox) ── */
#vignette-overlay {
  position:fixed; inset:0; z-index:500;
  display:none;
  pointer-events:none;
  background:#000;
  opacity:0; transition:opacity .55s ease;
}
/* Overlay background is click-through — only #vgn-continue-btn captures pointer events.
   This ensures clicks on the area where #btn-continue sits (below the overlay)
   reach the bottom bar rather than being swallowed by the cinematic layer. */
#vignette-overlay.vgn-visible { opacity:1; }

#vgn-art {
  position:absolute; inset:0; z-index:1;
  display:flex; align-items:center; justify-content:center;

}

  width:100%; height:100%;
  object-fit:contain;

}
/* top bar — overlaid */

}
/* bottom bar — overlaid with gradient veil */
#vgn-bar-bottom {

  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;

  transition:opacity .28s; margin:0;
  text-shadow:0 1px 6px rgba(0,0,0,.8);

  height:2px; width:0; max-width:220px; align-self:center;
  background:rgba(255,255,255,.35); border-radius:1px;

  color:rgba(255,255,255,.52);

/* ── CINEMATIC OPENER ── */

.cinema-place { font-size:12px; color:var(--teal); letter-spacing:3px; text-transform:uppercase; margin-bottom:28px; }
.cinema-text { font-size:14px; color:var(--text-dim); line-height:2.0; font-style:italic; max-width:380px; margin:0 auto 36px; }
.cinema-btn { background:transparent; border:1px solid var(--text-dim); color:var(--text-dim); padding:12px 36px; border-radius:4px; cursor:pointer; font-family:'Courier New',monospace; font-size:12px; letter-spacing:3px; text-transform:uppercase; transition:all .2s; }
.cinema-btn:hover { border-color:var(--teal); color:var(--teal); }
/* ── WHATSAPP MULTI-CONTACT ── */
.wp-container { display:flex; height:100%; overflow:hidden; }
.wp-sidebar { width:90px; flex-shrink:0; background:#040c07; border-right:1px solid #1a3a24; overflow-y:auto; display:flex; flex-direction:column; }
.wp-sidebar::-webkit-scrollbar { width:2px; }
.wp-contact { display:flex; flex-direction:column; align-items:center; padding:10px 6px; cursor:pointer; border-bottom:1px solid #0e2a18; transition:background .1s; position:relative; gap:4px; }
.wp-contact:hover { background:#071510; }
.wp-contact.active { background:#0a1e10; border-left:2px solid #25d366; }
.wp-contact-av { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px; color:#000; flex-shrink:0; }
.wp-contact-name { font-size:9px; color:var(--text-dim); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:76px; }
.wp-badge { position:absolute; top:6px; right:8px; background:#25d366; color:#000; font-size:9px; font-weight:bold; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; }

/* ── MULTIMEDIA BUBBLES ── */
.media-img { margin-top:5px; background:linear-gradient(135deg,#0d2a1a,#0a1f14); border-radius:8px; height:90px; display:flex; align-items:center; justify-content:center; font-size:28px; overflow:hidden; max-width:220px; }

.media-voice-bars { display:flex; align-items:center; gap:2px; flex:1; height:20px; }

.media-file-icon { font-size:20px; flex-shrink:0; }
.media-file-info .media-file-name { font-size:12px; color:var(--text); font-weight:bold; }
.media-file-info .media-file-size { font-size:10px; color:var(--text-dim); }
</style>
</head>
<body>

<div id="fade"></div>

<!-- VIGNETTE OVERLAY (cinematic) -->
<div id="vignette-overlay">
  <div id="vgn-bg"></div>
  <div id="vgn-art"></div>
  <div id="vgn-bar-top"><span id="vgn-label"></span></div>
  <div id="vgn-bar-bottom">
    <div id="vgn-caption-wrap"><p id="vgn-subtitle"></p></div>

    <button id="vgn-continue-btn" onclick="triggerPrimaryAction('click')">&#9654;&nbsp;CONTINUAR</button>

</div>

<!-- CINEMATIC OPENER -->
<div id="cinema-overlay">
  <div class="cinema-inner">
    <div class="cinema-art" id="cinema-art"></div>
    <div class="cinema-sub">kabu studio</div>
    <div class="cinema-title">Dispatcher</div>
    <div class="cinema-place">Providencia &middot; Chile &middot; 21:11</div>
   
    <button class="cinema-btn" onclick="startGame()">&#9654;&nbsp;&nbsp;INICIAR</button>
  </div>
</div>

<div id="toast">
  <div class="toast-title"><span class="dot blink"></span>ENTRANTE — CANAL 911</div>
  <div class="toast-text" id="toast-text"></div>
  <div class="toast-hint" onclick="goTo911()">▶  Presiona C o haz clic aquí</div>
</div>

<div id="key-hint"></div>

<!-- HEADER -->
<div id="header">
  <div id="hdr-logo">Dispatcher</div>
  <div id="hdr-scene">Cargando guion…</div>
  <button id="sound-btn" title="Sonido on/off" onclick="AUDIO.toggleMute()">🔊</button>
</div>

<!-- MAIN CONTENT -->
<div id="main">

  <!-- LEFT: NARRATION -->
  <div id="narr-panel">
    <div id="narr-label"></div>
    <div id="narr-feed"></div>
  </div>

  <!-- RIGHT: MODULE PANEL -->
  <div id="right-panel">
    <div id="mod-bar">
      <button class="mbtn" id="mb-chat"     onclick="setModule('chat')">Canal 911</button>
      <button class="mbtn" id="mb-manual"   onclick="setModule('manual')">Manual</button>
      <button class="mbtn" id="mb-map"      onclick="setModule('map')">Mapa</button>

</div>

<!-- BOTTOM BAR -->
<div id="bottom">
  <div id="action-row">
    <button id="btn-continue" class="pulsing" onclick="triggerPrimaryAction('click')">CONTINUAR</button>
    <button class="btn-choice" id="bc1" disabled onclick="resolveChoice(0)"></button>
    <button class="btn-choice" id="bc2" disabled onclick="resolveChoice(1)"></button>
  </div>
  <div id="status-bar">Iniciando…</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
const G = {
  story: null, scenes: {}, sceneOrder: [],
  currentSceneId: '', currentScene: {},
  beatIndex: 0,
  waitingChoice: false, pendingChoice: null,
  injectedBeats: [], pendingGoto: null,
  currentModule: 'chat',
  emergencyFeed: [], narrationLog: [], personalFeed: [],
  mapFeed: ['Sistema CCE activo. Sin referencias registradas.'],
  emergencyUnread: 0, personalUnread: 0, mapUnread: 0, dispatchUnread: 0,
  pending911: false, last911Text: '', last911Speaker: '',
  sceneCutPending: false,
  manualIdx: 0, manualCats: [], manualFilter: '',
  globalFacts: { local: '—', address: '—', plate: '—', vehicle: '—', dispatch: '—' },
  facts: { local: '—', address: '—', plate: '—', vehicle: '—', dispatch: '—' },
  cases: [], caseById: {}, activeCaseId: null, caseFacts: {},
  dispatchedUnits: [],
  cuesSeen: new Set(),
  inputMode: false, inputField: null, inputAnswer: null, inputSetValue: null, inputHint: '', inputErrorMsg: '',
  toolMode: null, toolPending: false, _addrQuery: '', _addrSearched: false,
  dispatchMode: false, selectedUnits: [], toolOpen: false,
  waContacts: {}, waActive: 'dani',
  vignettePending: false, vignetteOpen: false, gameStarted: false,
  vignetteClosing: false,
  primaryActionAt: 0,
  inputSubmitInFlight: false,
  advanceInFlight: false, advanceLastAt: 0,
};

// ═══════════════════════════════════════════════════════════════════════════
// DATA-DRIVEN LOADING
// Guion y assets pueden vivir fuera de este HTML.
// Si abres el archivo directo y fetch falla, se usa el fallback embebido.
// ═══════════════════════════════════════════════════════════════════════════
const DATA_URLS = {
  story: 'data/dispatcher_story.json',
  assets: 'data/dispatcher_assets.json'
};

let STORY_DATA = null;
const DEFAULT_ASSET_DATA = {
  audio: { music: {}, sfx: {} },
  vignettes: {},
  cinema: {},
  contacts: {},
  whatsapp: {}
};
let ASSET_DATA = JSON.parse(JSON.stringify(DEFAULT_ASSET_DATA));

function deepMerge(base, extra) {
  if (!extra || typeof extra !== 'object') return base;
  const out = Array.isArray(base) ? [...base] : { ...base };
  for (const [k, v] of Object.entries(extra)) {
    if (v && typeof v === 'object' && !Array.isArray(v)) out[k] = deepMerge(out[k] || {}, v);
    else out[k] = v;
  }
  return out;
}

async function loadJsonMaybe(url) {
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    return await res.json();
  } catch (err) {
    console.warn('[Dispatcher] No se pudo cargar ' + url + '. Usando fallback si existe.', err);
    return null;
  }
}

async function boot() {
  const story = await loadJsonMaybe(DATA_URLS.story);
  const assets = await loadJsonMaybe(DATA_URLS.assets);
  if (story) STORY_DATA = story;
  else STORY_DATA = DEFAULT_STORY_DATA;
  ASSET_DATA = deepMerge(DEFAULT_ASSET_DATA, assets || {});
  init();
}

function setPath(root, path, value) {
  if (!path) return;
  const parts = path.split('.').filter(Boolean);
  let obj = root;
  for (let i = 0; i < parts.length - 1; i++) {
    const k = parts[i];
    if (!obj[k] || typeof obj[k] !== 'object') obj[k] = {};
    obj = obj[k];
  }
  obj[parts[parts.length - 1]] = value;
}

function applyTemplate(s, vars) {
  return String(s || '').replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
}

function defaultFacts() {
  return { local: '—', address: '—', plate: '—', vehicle: '—', dispatch: '—' };
}

function activeCase() {
  return G.activeCaseId ? (G.caseById[G.activeCaseId] || null) : null;
}

function setActiveCase(caseId) {
  if (!caseId || !G.caseById[caseId]) return;
  if (!G.caseFacts[caseId]) {
    G.caseFacts[caseId] = { ...defaultFacts(), ...((G.caseById[caseId] || {}).initial_facts || {}) };
  }
  G.activeCaseId = caseId;
  G.facts = G.caseFacts[caseId];
}

function getCaseFields() {
  const c = activeCase();
  return { ...(G.story.case_fields || {}), ...((c && c.case_fields) || {}) };
}

function getToolSearch() {
  const c = activeCase();
  return { ...(G.story.tool_search || {}), ...((c && c.tool_search) || {}) };
}

function getDispatchRules() {
  const c = activeCase();
  return (c && c.dispatch_rules) || G.story.dispatch_rules || {};
}

function getToolConfig(toolKey) {
  return (getToolSearch() || {})[toolKey] || {};
}

function setFactValue(key, value) {
  if (!key) return;
  if (key.includes('.')) setPath(G, key, value);
  else G.facts[key] = value;
}

function isWhatsAppScene(sceneId) {
  const sid = sceneId || G.currentSceneId;
  const sc = sid ? G.scenes[sid] : null;
  return !!(sc && sc.channel === 'whatsapp');
}

let EMERGENCY_SCENES = new Set();

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════
function init() {
  G.story = STORY_DATA || DEFAULT_STORY_DATA;
  G.scenes = {};
  G.sceneOrder = [];
  G.cases = G.story.cases || [];
  G.caseById = {};
  G.cases.forEach(c => { if (c && c.id) G.caseById[c.id] = c; });
  G.caseFacts = {};
  G.activeCaseId = null;
  G.globalFacts = defaultFacts();
  G.facts = G.globalFacts;
  G.manualCats = G.story.manual_categories || [];
  (G.story.scenes || []).forEach(s => { G.scenes[s.id] = s; G.sceneOrder.push(s.id); });
  const explicitEmergency = G.story.emergency_scenes || [];
  const sceneEmergency = (G.story.scenes || [])
    .filter(s => s.channel === '911' || s.emergency === true)
    .map(s => s.id);
  EMERGENCY_SCENES = new Set([...explicitEmergency, ...sceneEmergency]);
  G.currentSceneId = G.story.start || G.sceneOrder[0] || '';
  G.currentScene = G.scenes[G.currentSceneId] || {};
  initWA();
  addNarr('n-scene', '— DISPATCHER —  por kabu studio');
  addNarr('n-line',  'Noche otoñal. Las 21:11.');
  showCinematic();
}

function startGame() {
  G.gameStarted = true;
  closeCinematic();
  setTimeout(() => enterScene(G.currentSceneId), 900);
}

// ═══════════════════════════════════════════════════════════════════════════
// SCENE MANAGEMENT
// ═══════════════════════════════════════════════════════════════════════════
function enterScene(id) {
  if (!G.scenes[id]) { addNarr('n-alert','Error: escena no encontrada.'); return; }
  AUDIO.stopSfx();
  if (G.vignetteOpen || G.vignettePending) {
    G.vignetteOpen = false;
    G.vignettePending = false;
    _vignetteClose();
  }
  G.currentSceneId = id;
  G.currentScene   = G.scenes[id];
  if (G.currentScene.case_id) setActiveCase(G.currentScene.case_id);
  G.beatIndex      = 0;
  G.waitingChoice  = false;
  G.pendingChoice  = null;
  G.injectedBeats  = [];
  G.pendingGoto    = null;
  G.sceneCutPending= true;
  G.cuesSeen       = new Set();
  G.inputMode = false;
  G.inputField = null;
  G.inputAnswer = null;
  G.inputSetValue = null;
  G.inputHint = '';
  G.inputErrorMsg = '';
  G.vignetteClosing = false;
  G.toolMode = null; G.toolPending = false; G.toolOpen = false;
  G._addrQuery = ''; G._addrSearched = false;
  G.dispatchMode = false; G.selectedUnits = [];
  // Auto-switch to Canal 911 for emergency scenes
  if (EMERGENCY_SCENES.has(id)) {
    G.currentModule   = 'chat';
    G.emergencyUnread = 0;
    G.pending911      = false;
    hideToast();
  }
  addNarr('n-scene', '— ' + (G.currentScene.title || id) + ' —');
  if (G.currentScene.case_id && activeCase()) {
    const c = activeCase();
    if (id === c.start_scene) addNarr('n-cue', '🗂  Caso activo: ' + (c.title || c.id) + '. Revisa el Manual si corresponde [M].');
  }
  document.getElementById('hdr-scene').textContent = G.currentScene.title || id;
  refreshUI();
}

// ═══════════════════════════════════════════════════════════════════════════
// ADVANCE
// ═══════════════════════════════════════════════════════════════════════════
function advance() {
  const now = Date.now();
  // Ignore accidental double-triggering from rapid key+click combinations.
  if (G.advanceInFlight) return;
  if (now - (G.advanceLastAt || 0) < 90) return;
  G.advanceInFlight = true;
  G.advanceLastAt = now;

  try {
  if (G.waitingChoice)   return;
  if (!G.gameStarted)    return;
  if (G.inputMode)       { refreshUI(); return; }
  if (G.vignetteClosing) { refreshUI(); return; }
  if (G.toolPending)     { refreshUI(); return; }
  if (G.dispatchMode)    { refreshUI(); return; }
  if (G.vignettePending) {
    // Dynamic vignette (vignetteOpen=true): CONTINUAR inside overlay calls advance() → clears pending
    if (G.vignetteOpen) { G.vignettePending = false; }
    else { refreshUI(); return; }  // Simple vignette: wait for overlay CONTINUAR button
  }

  if (needsWhatsApp()) {
    cueOnce('wp_gate','n-cue','📱 Tu celular vibra. Lee el mensaje de Dani antes de continuar [W].');
    refreshUI(); return;
  }

  if (G.sceneCutPending) {
    G.sceneCutPending = false;
    doFade(() => advance());
    return;
  }

  if (G.injectedBeats.length > 0) {
    const b = G.injectedBeats.shift();
    pushBeat(b);
    if (G.inputMode)   { refreshUI(); return; }
    if (G.toolPending) { refreshUI(); return; }
    if (G.dispatchMode){ refreshUI(); return; }
    if (G.injectedBeats.length === 0 && G.pendingGoto) {
      const g = G.pendingGoto; G.pendingGoto = null; enterScene(g);
    } else refreshUI();
    return;
  }

  const beats = G.currentScene.beats || [];
  if (G.beatIndex < beats.length) {
    const b = beats[G.beatIndex++];
    pushBeat(b);
    if (G.inputMode)   { refreshUI(); return; }
    if (G.toolPending) { refreshUI(); return; }
    if (G.dispatchMode){ refreshUI(); return; }
    const ch = findChoice(G.beatIndex);
    if (ch) {
      G.waitingChoice = true;
      G.pendingChoice = ch;
      addNarr('n-prompt', '❓ ' + (ch.prompt || 'Elige una opción'));
    }
    refreshUI(); return;
  }

  // Check for choices that fire at end-of-beats (e.g. after an input beat was last)
  const chEnd = findChoice(G.beatIndex);
  if (chEnd) {
    G.waitingChoice = true;
    G.pendingChoice = chEnd;
    addNarr('n-prompt', '❓ ' + (chEnd.prompt || 'Elige una opción'));
    refreshUI(); return;
  }
  const nxt = G.currentScene.next;
  if (typeof nxt === 'string' && nxt) { enterScene(nxt); }
  else { addNarr('n-end','— Fin de la reproducción —'); refreshUI(); }
  } finally {
    G.advanceInFlight = false;
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// BEAT ROUTING
// ═══════════════════════════════════════════════════════════════════════════
function pushBeat(beat) {
  if (!beat || typeof beat !== 'object') return;
  const kind = beat.kind || 'line';
  // ── INPUT BEAT: pause narrative, show form ────────────────────────────────
  if (kind === 'input') {
    G.inputMode     = true;
    G.inputField    = beat.field     || '';
    G.inputAnswer   = beat.answer    || '';
    G.inputSetValue = beat.setValue  || '';
    G.inputHint     = beat.hint      || 'Registra el dato del incidente';
    G.inputErrorMsg = beat.errorMsg  || '';
    addNarr('n-prompt', '📋 ' + G.inputHint);
    return;
  }
  // ── DISPATCH BEAT ─────────────────────────────────────────────────────────────
  if (kind === 'dispatch') {
    G.dispatchMode  = true;
    G.selectedUnits = [];
    G.dispatchUnread++;
    addNarr('n-cue', '🚔 Seleccioná las unidades a enviar. Abrí la Consola de Despacho [D].');
    return;
  }
  // ── TOOL-SEARCH BEAT: open interactive search tool in Map ─────────────────────
  if (kind === 'tool-search') {
    G.toolMode    = beat.tool || 'address';
    G.toolPending = true;
    G.toolOpen    = false;
    const toolMsgs = {
      address: '📍 Buscá la dirección del local en el panel Mapa [P].',
      vehicle: '🔍 Identificá el modelo BMW en el panel Mapa [P].'
    };
    addNarr('n-prompt', toolMsgs[beat.tool] || '📍 Abrí el Mapa para completar la búsqueda.');
    G.mapUnread++;
    return;
  }
  if (kind === 'sfx') {
    const action = beat.action || 'play';
    if (action === 'stop') {
      AUDIO.stopSfx();
      return;
    }
    if (action === 'replace') {
      AUDIO.replaceSfx(beat.sfx || 'notif');
      return;
    }
    AUDIO.sfx(beat.sfx || 'notif');
    return;
  }
  if (kind === 'ambient') {
    if (beat.stop) {
      AUDIO.stopAmbient();
      return;
    }
    if (beat.ambient) {
      AUDIO.startAmbient(beat.ambient);
      return;
    }
    console.warn('Ambient beat sin clave: no-op', beat);
    return;
  }
  if (kind === 'vignette') {
    const action = beat.action || '';
    if (!action) {
      // ── Simple vignette: user-controlled — waits for CONTINUAR in overlay ──
      G.vignettePending = true;
      showVignette(beat.scene || 'arrival', { min_duration_ms: beat.min_duration_ms }, () => { G.vignettePending = false; advance(); });
      return;
    }
    if (action === 'open') {
      G.vignetteOpen = true;
      G.vignettePending = true;
      _vignetteOpenShot(beat.scene || '', beat.text || '');
      return; // block progression until user closes overlay
    }
    if (action === 'text') {
      if (G.vignetteOpen) _vignetteUpdateText(beat.text || '');
      G.vignettePending = true; // player presses CONTINUAR to advance
      return;
    }
    if (action === 'change') {
      if (G.vignetteOpen) _vignetteChangeShot(beat.scene || '', beat.text || '');
      G.vignettePending = true;
      return;
    }
    if (action === 'close') {
      G.vignetteOpen = false;
      G.vignettePending = false;
      _vignetteClose();
      return; // non-blocking
    }
    return;
  }
  if (kind === 'wa') {
    const cid = beat.contact || 'dani';
    const c   = G.waContacts[cid];
    if (c) {
      c.messages.push({ speaker: beat.speaker || cid, text: beat.text || '', mediaType: beat.mediaType, url: beat.url, caption: beat.caption, name: beat.name, dur: beat.dur });
      if (G.currentModule !== 'personal' || G.waActive !== cid) { c.unread++; G.personalUnread++; }
      refreshUI();
    }
    return;
  }
  const text    = (beat.text || '').trim();
  if (!text) return;
  const speaker = beat.speaker || null;
  const isPersonal  = isWhatsAppScene() || (!!speaker && !!G.waContacts[speaker.toLowerCase()]);
  const inEmergency = EMERGENCY_SCENES.has(G.currentSceneId);
  const isIncoming  = speaker === 'MENSAJE' || speaker === 'MIRNA';

  if (kind === 'narration' || !speaker) {
    addNarr('n-line', text);
    const lo = text.toLowerCase();
    if (lo.includes('mapa') && lo.includes('parpade'))
      cueOnce('map_cue','n-cue','🗺  El mapa parpadea en pantalla. Ábrelo para ver la dirección [P].');
    if (lo.includes('icono web') || lo.includes('ícono web'))
      cueOnce('web_cue','n-cue','🌐 Buscador web activo. Eric busca el modelo BMW en línea.');
    if (lo.includes('iconos parpadean'))
      cueOnce('dispatch_cue','n-cue','🚔 Pestaña Despacho activa. Elige las unidades a enviar [D].');
  } else if (isPersonal) {
    G.personalFeed.push({ speaker, text, mediaType: beat.mediaType, url: beat.url, caption: beat.caption, name: beat.name, dur: beat.dur });
    if (G.personalFeed.length > 120) G.personalFeed.shift();
    if (G.currentModule !== 'personal') {
      G.personalUnread++;
      cueOnce('wp_cue','n-cue','📱 Dani te escribió. Abre WhatsApp [W].');
    }
  } else if (inEmergency) {
    G.emergencyFeed.push({ speaker, text, mediaType: beat.mediaType, url: beat.url, caption: beat.caption, name: beat.name, dur: beat.dur });
    if (G.emergencyFeed.length > 120) G.emergencyFeed.shift();
    if (isIncoming && G.currentModule !== 'chat') {
      G.emergencyUnread++;
      G.pending911 = true;
      G.last911Text    = text.slice(0, 90);
      G.last911Speaker = speaker;
      showToast(speaker, G.last911Text);
      cueOnce('e911_cue','n-alert','🚨 Llamada entrante en Canal 911. Atiende ahora [C].');
    }
  } else {
    addNarr('n-line', speaker + ': ' + text);
  }
  extractFacts(beat);
}

// ═══════════════════════════════════════════════════════════════════════════
// INPUT VALIDATION
// ═══════════════════════════════════════════════════════════════════════════
function showNotif(label, value) {
  const area = document.getElementById('notif-area');
  if (!area) return;
  const el = document.createElement('div');
  el.className = 'notif';
  el.innerHTML = '<div class="notif-lbl">▸ ' + esc(label) + '</div><div class="notif-val">' + esc(value) + '</div>';
  area.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'notif-out .3s ease forwards';
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
  }, 3800);
}

function escAttr(s) { return (s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function normalizeStr(s) {
  return (s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[\s\-\.]/g,'').trim();
}

function matchAnswer(input, expected) {
  const ni = normalizeStr(input);
  const ne = normalizeStr(expected);
  return ni.includes(ne) || ne.includes(ni);
}

function submitInput() {
  if (G.inputSubmitInFlight) return;
  G.inputSubmitInFlight = true;
  const el = document.getElementById('inp-answer');
  if (el) resolveInput(el.value);
  setTimeout(() => { G.inputSubmitInFlight = false; }, 0);
}

function resolveInput(val) {
  if (!G.inputMode) return;
  const trimmed = (val || '').trim();
  if (!trimmed) return;
  if (!matchAnswer(trimmed, G.inputAnswer)) {
    const errMsg = G.inputErrorMsg || '❌ No coincide. Revisa lo que dijo la persona en la llamada e inténtalo de nuevo.';
    addNarr('n-alert', errMsg);
    const el = document.getElementById('inp-answer');
    if (el) { el.value = ''; el.focus(); }
    return;
  }
  G.inputMode = false;
  const fld = G.inputField;
  const setVal = G.inputSetValue || trimmed;
  const cfg = (getCaseFields() || {})[fld] || {};
  if (cfg.factPath) setPath(G, cfg.factPath, setVal);
  else if (fld && G.facts) G.facts[fld] = setVal;

  const logLine = cfg.logTemplate ? applyTemplate(cfg.logTemplate, { value: setVal, field: fld }) : ('✔ ' + fld + ': ' + setVal);
  G.mapFeed.push(logLine);
  if (G.currentModule !== 'map') G.mapUnread++;

  showNotif(cfg.notificationLabel || 'DATO REGISTRADO', setVal);
  G.inputField = null; G.inputAnswer = null; G.inputSetValue = null; G.inputHint = ''; G.inputErrorMsg = '';
  advance();
}

// ═══════════════════════════════════════════════════════════════════════════
// CHOICES
// ═══════════════════════════════════════════════════════════════════════════
function findChoice(at) {
  return (G.currentScene.choices || []).find(c => Number(c.at) === Number(at)) || null;
}

function resolveChoice(idx) {
  if (!G.waitingChoice || !G.pendingChoice) return;
  const opts = G.pendingChoice.options || [];
  if (idx < 0 || idx >= opts.length) return;
  const picked = opts[idx];
  addNarr('n-chosen', '↳ ' + (picked.label || 'Opción ' + (idx+1)));
  G.injectedBeats = (picked.beats || []).filter(b => b && typeof b === 'object');
  G.waitingChoice = false;
  G.pendingChoice = null;
  G.pendingGoto   = picked.goto || null;
  // Auto-switch to Canal 911 when choice beats happen in emergency context
  if (EMERGENCY_SCENES.has(G.currentSceneId) && G.injectedBeats.length > 0) {
    G.currentModule   = 'chat';
    G.emergencyUnread = 0;
    G.pending911      = false;
    hideToast();
  }
  if (G.injectedBeats.length > 0) { advance(); return; }
  if (G.pendingGoto) { const g = G.pendingGoto; G.pendingGoto = null; enterScene(g); return; }
  refreshUI();
}

// ═══════════════════════════════════════════════════════════════════════════
// EXTRACT CASE FACTS
// ═══════════════════════════════════════════════════════════════════════════
function extractFacts(beat) {
  const lo = (beat && beat.text ? beat.text : '').toLowerCase();
  if (!lo) return;
  if (beat.speaker === 'ERIC' && lo.includes('carabineros') && lo.includes('seguridad') && G.facts.dispatch === '—') {
    G.facts.dispatch = 'Carabineros + Seguridad Ciudadana';
    ['Carabineros','Seguridad Ciudadana'].forEach(u => {
      if (!G.dispatchedUnits.includes(u)) G.dispatchedUnits.push(u);
    });
    if (G.currentModule !== 'dispatch') G.dispatchUnread++;
  } else if (beat.speaker === 'ERIC' && lo.includes('carabineros') && G.facts.dispatch === '—') {
    G.facts.dispatch = 'Carabineros';
    if (!G.dispatchedUnits.includes('Carabineros')) G.dispatchedUnits.push('Carabineros');
    if (G.currentModule !== 'dispatch') G.dispatchUnread++;
  }
  if (G.mapFeed.length > 40) G.mapFeed = G.mapFeed.slice(-40);
}

// ═══════════════════════════════════════════════════════════════════════════
// UI REFRESH
// ═══════════════════════════════════════════════════════════════════════════
function refreshUI() {
  refreshModBar();
  renderPanel();
  refreshControls();
  refreshStatus();
}

function refreshModBar() {
  const defs = {
    chat:     { lbl: 'Canal 911',  id: 'mb-chat' },
    manual:   { lbl: 'Manual',     id: 'mb-manual' },
    map:      { lbl: 'Mapa',       id: 'mb-map' },
    dispatch: { lbl: 'Despacho',   id: 'mb-dispatch' },
    personal: { lbl: 'WhatsApp',   id: 'mb-personal' },
  };
  for (const [mod, cfg] of Object.entries(defs)) {
    const btn = document.getElementById(cfg.id);
    btn.className = 'mbtn' + (mod === G.currentModule ? ' active' : '');
    let lbl = cfg.lbl;
    if (mod === 'chat' && G.emergencyUnread > 0 && G.currentModule !== 'chat') {
      lbl = '🚨 911 (' + G.emergencyUnread + ')';
      btn.className += ' req-911';
    }
    if (mod === 'personal' && G.personalUnread > 0 && G.currentModule !== 'personal') {
      lbl = '📱 WA (' + G.personalUnread + ')';
      if (isWhatsAppScene()) btn.className += ' req-wp';
    }
    if (mod === 'map' && G.mapUnread > 0 && G.currentModule !== 'map') {
      lbl = '🗺 Mapa (' + G.mapUnread + ')';
      btn.className += ' req-update';
    }
    if (mod === 'dispatch' && G.dispatchUnread > 0 && G.currentModule !== 'dispatch') {
      lbl = '🚔 Despacho (' + G.dispatchUnread + ')';
      btn.className += ' req-update';
    }
    btn.textContent = lbl;
  }
}

function renderPanel() {
  const el = document.getElementById('panel-content');
  if      (G.currentModule === 'chat')     el.innerHTML = htmlEmergency();
  else if (G.currentModule === 'personal') el.innerHTML = htmlWhatsApp();
  else if (G.currentModule === 'manual')   el.innerHTML = htmlManual();
  else if (G.currentModule === 'map')      el.innerHTML = htmlMap();
  else if (G.currentModule === 'dispatch') el.innerHTML = htmlDispatch();
  // auto-scroll feeds
  ['e-feed','wp-msgs','mp-activity'].forEach(id => {
    const f = document.getElementById(id); if (f) f.scrollTop = f.scrollHeight;
  });
}

// ── PANEL: EMERGENCY 911 ──
function htmlEmergency() {
  const active = G.emergencyFeed.length > 0 || EMERGENCY_SCENES.has(G.currentSceneId);
  const rows = G.emergencyFeed.length > 0
    ? G.emergencyFeed.slice(-30).map(m => {
        const isInc = m.speaker === 'MENSAJE' || m.speaker === 'MIRNA';
        const name  = isInc ? (m.speaker === 'MENSAJE' ? 'LLAMADA' : m.speaker) : 'ERIC';
        const cls   = isInc ? 'el-bubble-in' : 'el-bubble-out';
        return `<div class="${cls}"><div class="el-bname">${esc(name)}</div><div class="el-btext">${renderMediaContent(m)}</div></div>`;
      }).join('')
    : '<div class="el-sys">En espera de comunicaciones…</div>';
  return `<div class="ep-wrap">
    <div class="ep-head"><span class="dot${active?' blink':''}"></span>CANAL 911 — CCE-01 / TURNO NOCHE<span style="margin-left:auto;font-size:10px;opacity:.5">ACTIVO</span></div>
    <div id="e-feed">${rows}</div>
  </div>`;
}

function renderMediaContent(m) {
  if (!m || !m.mediaType) return esc(m ? m.text || '' : '');
  let out = m.text ? `<div>${esc(m.text)}</div>` : '';
  if (m.mediaType === 'image') {
    out += `<div class="media-img">${m.url ? `<img src="${escAttr(m.url)}" style="width:100%;height:100%;object-fit:cover" alt="imagen">` : '📷'}</div>`;
    if (m.caption) out += `<div class="media-caption">${esc(m.caption)}</div>`;
  } else if (m.mediaType === 'voice') {
    const h = [4,7,5,9,6,8,4,11,7,5,9,6,8,5,7,4,10,6,8,5];
    const bars = h.map(v => `<div class="media-voice-bar" style="height:${v}px"></div>`).join('');
    out += `<div class="media-voice"><span>🎤</span><div class="media-voice-bars">${bars}</div><span class="media-voice-dur">${esc(m.dur||'0:00')}</span></div>`;
  } else if (m.mediaType === 'file') {
    const icon = /pdf/i.test(m.name||'') ? '📄' : /xls|csv/i.test(m.name||'') ? '📊' : '📎';
    out += `<div class="media-file"><span class="media-file-icon">${icon}</span><div class="media-file-info"><div class="media-file-name">${esc(m.name||'archivo')}</div><div class="media-file-size">${esc(m.size||'')}</div></div></div>`;
  }
  return out;
}

// ── PANEL: WHATSAPP ──
function htmlWhatsApp() {
  const contacts    = Object.entries(G.waContacts);
  const activeData  = G.waContacts[G.waActive] || contacts[0]?.[1];
  const msgs        = activeData ? activeData.messages : G.personalFeed;
  const bubbles     = msgs.length > 0
    ? msgs.slice(-40).map(m => {
        const sent = m.speaker === 'ERIC';
        return `<div class="bubble ${sent?'sent':'recv'}">
          <div class="bubble-name">${esc(m.speaker)}</div>${renderMediaContent(m)}</div>`;
      }).join('')
    : '<div style="color:var(--text-dim);font-size:13px;text-align:center;padding-top:40px">Sin mensajes todavía</div>';
  const contactTabs = contacts.map(([id, c]) => {
    const isAct = id === G.waActive;
    const badge = c.unread > 0 ? `<div class="wp-badge">${c.unread}</div>` : '';
    return `<div class="wp-contact${isAct?' active':''}" onclick="setWaActive('${escAttr(id)}')">
      <div class="wp-contact-av" style="background:${c.color}">${esc(c.avatar)}</div>
      <div class="wp-contact-name">${esc(c.name)}</div>
      ${badge}
    </div>`;
  }).join('');
  const head = activeData ? `
    <div class="wp-head">
      <div class="wp-av" style="background:${activeData.color}">${esc(activeData.avatar)}</div>
      <div><div class="wp-name" style="color:${activeData.color}">${esc(activeData.name)}</div><div class="wp-sub">${esc(activeData.status||'')}</div></div>
    </div>` : '';
  return `<div class="wp-container">
    <div class="wp-sidebar">${contactTabs}</div>
    <div class="wp-chat-area">
      <div class="wp-wrap" style="height:100%">
        ${head}
        <div id="wp-msgs">${bubbles}</div>
      </div>
    </div>
  </div>`;
}

function setWaActive(id) {
  G.waActive = id;
  const c = G.waContacts[id];
  if (c) { G.personalUnread = Math.max(0, G.personalUnread - c.unread); c.unread = 0; }
  renderPanel();
}

// ── PANEL: MANUAL ──
function htmlManual() {
  if (!G.manualCats.length) return '<div style="padding:20px;color:var(--text-dim)">Manual no disponible.</div>';
  const cats = getManualCatsFiltered();
  if (!cats.length) {
    return `<div class="mn-wrap">
      <div class="mn-nav">
        <button class="mn-btn" onclick="setManualFilter('')">◀ Limpiar</button>
        <div class="mn-counter">0 / 0</div>
        <button class="mn-btn" disabled>Siguiente ▶</button>
      </div>
      <div class="mn-card">
        <div class="mn-empty">No hay categorías que coincidan con <strong>${esc(G.manualFilter)}</strong>. Prueba otra keyword.</div>
      </div>
    </div>`;
  }
  const total = cats.length;
  const cat = cats[G.manualIdx] || cats[0] || G.manualCats[0];
  const keys  = (cat.keys  || []).map(k => `<button class="mn-key${normalizeStr(G.manualFilter) === normalizeStr(k) ? ' active' : ''}" onclick="setManualFilter('${escAttr(k)}')">${esc(k)}</button>`).join('');
  const steps = (cat.steps || []).map((s,i) =>
    `<div class="mn-step"><span class="mn-num">${i+1}</span>${esc(s)}</div>`).join('');
  const avoid = (cat.avoid || []).map(a => `<div class="mn-avoid">✕  ${esc(a)}</div>`).join('');
  const idx   = cats.map((c,i) =>
    `<div class="mn-idx-item${i===G.manualIdx?' active':''}" onclick="jumpCat(${i})">${esc(c.name)}</div>`).join('');
  return `<div class="mn-wrap">
    <div class="mn-nav">
      <button class="mn-btn" onclick="prevCat()">◀ Anterior</button>
      <div class="mn-counter">${G.manualIdx+1} / ${total}</div>
      <button class="mn-btn" onclick="nextCat()">Siguiente ▶</button>

      </div>

      <div class="mn-idx"><div class="mn-idx-h">Índice rápido</div>${idx}</div>
    </div>
  </div>`;
}
function getManualCatsFiltered() {
  const q = normalizeStr(G.manualFilter || '');
  if (!q) return G.manualCats;
  return G.manualCats.filter(cat => {
    const blob = [cat.id, cat.name, cat.when, cat.dispatch, ...(cat.keys || []), ...(cat.steps || []), ...(cat.avoid || [])].join(' ');
    return normalizeStr(blob).includes(q);
  });
}
function setManualFilter(filter) {
  G.manualFilter = (filter || '').trim();
  G.manualIdx = 0;
  renderPanel();
}
function prevCat() {
  const cats = getManualCatsFiltered();
  if (!cats.length) return;
  G.manualIdx = (G.manualIdx - 1 + cats.length) % cats.length;
  renderPanel();
}
function nextCat() {
  const cats = getManualCatsFiltered();
  if (!cats.length) return;
  G.manualIdx = (G.manualIdx + 1) % cats.length;
  renderPanel();
}
function jumpCat(i) {
  const cats = getManualCatsFiltered();
  if (!cats.length) return;
  G.manualIdx = Math.max(0, Math.min(i, cats.length - 1));
  renderPanel();
}

function matchDispatchOutcome(units, rules) {
  const outcomes = rules.outcomes || [];
  const required = rules.required_units || [];
  const set = new Set(units);
  for (const o of outcomes) {
    if (o.match === 'all_required' && required.length && required.every(u => set.has(u)) && units.length === required.length) return o;
    if (o.match === 'contains_required' && required.length && required.every(u => set.has(u))) return o;
    if (Array.isArray(o.match_units)) {
      const sameLen = o.match_units.length === units.length;
      const sameUnits = o.match_units.every(u => set.has(u));
      if (sameLen && sameUnits) return o;
    }
  }
  return outcomes.find(o => o.match === 'fallback') || { notification:'DESPACHO REGISTRADO', beats:[] };
}

function confirmDispatch() {
  if (!G.dispatchMode || G.selectedUnits.length === 0) return;
  const rules = getDispatchRules();
  const units = [...G.selectedUnits];
  const label = units.join(' + ');
  const outcome = matchDispatchOutcome(units, rules);

  G.dispatchedUnits = units;
  G.dispatchMode  = false;
  G.selectedUnits = [];
  G.facts.dispatch = label + ' — En camino';
  G.mapFeed.push('Despacho: ' + label);
  showNotif(outcome.notification || 'UNIDADES DESPACHADAS', label);

  G.injectedBeats = (outcome.beats || []).map(b => {
    const copy = { ...b };
    if (copy.text) copy.text = applyTemplate(copy.text, { label, units: label });
    return copy;
  });
  G.pendingGoto   = rules.next || 'outro';
  G.currentModule = 'chat';
  advance();
}

function refreshControls() {
  const actionRow = document.getElementById('action-row');
  if (actionRow) actionRow.className = 'action-primary';
  // ── INPUT FORM MODE ─────────────────────────────────────────────────────────────────────
  if (G.inputMode) {
    if (actionRow) actionRow.className = 'action-input';
    document.getElementById('action-row').innerHTML =
      '<div class="input-wrap">' +
      '<input id="inp-answer" class="inp-answer" type="text" ' +
      'placeholder="' + escAttr(G.inputHint) + '" autocomplete="off" spellcheck="false"/>' +
      '<button class="btn-submit" onclick="triggerPrimaryAction(\'input-button\')">&#x2714; REGISTRAR</button>' +
      '</div>';
    const el = document.getElementById('inp-answer');
    if (el) {
      el.focus();
      el.onkeydown = e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          e.stopPropagation();
          triggerPrimaryAction('input-enter');
        }
      };
    }
    refreshStatus();
    return;
  }
  // ── TOOL SEARCH MODE ──────────────────────────────────────────────────────────
  if (G.toolMode) {
    if (actionRow) actionRow.className = 'action-primary';
    if (!G.toolOpen) {
      const lbl = G.toolMode === 'address'
        ? '&#x1F4CD; Buscar direcci&oacute;n en Mapa [P]'
        : '&#x1F50D; Identificar modelo BMW en Mapa [P]';
      document.getElementById('action-row').innerHTML =
        '<button class="btn-tool-open" onclick="setModule(\'map\')">' + lbl + '</button>';
    } else {
      document.getElementById('action-row').innerHTML =
        '<div style="color:var(--text-dim);font-size:12px;letter-spacing:.5px;padding:10px 4px">' +
        '&#9658; Completa la b&uacute;squeda en el panel <strong style="color:var(--teal)">MAPA</strong></div>';
    }
    refreshStatus();
    return;
  }
  // ── DISPATCH MODE ─────────────────────────────────────────────────────────────
  if (G.dispatchMode) {
    if (actionRow) actionRow.className = 'action-primary';
    document.getElementById('action-row').innerHTML =
      '<button class="btn-tool-open" onclick="setModule(\'dispatch\')">&#x1F694; Abrir Consola de Despacho [D]</button>';
    refreshStatus();
    return;
  }
  // ── RESTORE BUTTONS AFTER INPUT MODE ──────────────────────────────────────────
  if (!document.getElementById('btn-continue')) {
    document.getElementById('action-row').innerHTML =
      '<button id="btn-continue" class="pulsing" onclick="triggerPrimaryAction(\'click\')">CONTINUAR</button>' +
      '<button class="btn-choice" id="bc1" onclick="resolveChoice(0)"></button>' +
      '<button class="btn-choice" id="bc2" onclick="resolveChoice(1)"></button>';
  }
  const cb  = document.getElementById('btn-continue');
  const bc1 = document.getElementById('bc1');
  const bc2 = document.getElementById('bc2');
  cb.style.display = '';
  cb.classList.remove('pulsing');
  cb.onclick = () => triggerPrimaryAction('click');
  bc1.className = 'btn-choice'; bc2.className = 'btn-choice';
  bc1.style.flex = ''; bc2.style.display = '';
  // Always restore default onclick so manual-nav never breaks choice buttons
  bc1.onclick = () => resolveChoice(0);
  bc2.onclick = () => resolveChoice(1);

  if (G.vignetteClosing) {
    if (actionRow) actionRow.className = 'action-primary';
    cb.disabled = true; cb.textContent = 'CONTINUAR'; cb.classList.add('pulsing');
    cb.onclick = null;
    bc1.disabled = true; bc1.textContent = '';
    bc2.style.display = 'none';
    return;
  }

  if (needsWhatsApp()) {
    if (actionRow) actionRow.className = 'action-primary';
    cb.disabled = false; cb.textContent = '📱 Abrir WhatsApp  [W]';
    cb.onclick = () => handleBlockedContinue();
    bc1.disabled = true; bc1.textContent = '';
    bc2.style.display = 'none';
    return;
  }
  if (G.vignetteOpen || G.vignettePending || document.querySelector('#vignette-overlay.vgn-visible')) {
    if (actionRow) actionRow.className = 'action-primary';
    cb.disabled = false; cb.textContent = '🎬 CONTINUAR VIÑETA';
    cb.onclick = () => handleBlockedContinue();
    bc1.disabled = true; bc1.textContent = '';
    bc2.style.display = 'none';
    return;
  }
  if (G.waitingChoice && G.pendingChoice) {
    if (actionRow) actionRow.className = 'action-choice';
    const opts = G.pendingChoice.options || [];
    cb.style.display = 'none';
    cb.disabled = true;
    if (opts[0]) { bc1.disabled = false; bc1.textContent = opts[0].label; bc1.classList.add('live'); } else { bc1.disabled=true; bc1.textContent=''; }
    if (opts[1]) {
      bc2.style.display = ''; bc2.disabled = false; bc2.textContent = opts[1].label; bc2.classList.add('live');
    } else {
      bc2.style.display = 'none';
      bc1.style.flex = '3'; // expand single choice button
    }
    return;
  }
  if (actionRow) actionRow.className = 'action-primary';
  cb.disabled = false; cb.textContent = 'CONTINUAR'; cb.classList.add('pulsing');
  if (G.currentModule === 'manual' && G.manualCats.length > 1) {
    bc1.disabled = false; bc1.textContent = '◀ Anterior'; bc1.onclick = prevCat;
    bc2.style.display = ''; bc2.disabled = false; bc2.textContent = 'Siguiente ▶'; bc2.onclick = nextCat;
  } else {
    bc1.disabled = true; bc1.textContent = '';
    bc2.style.display = 'none';
  }
}

// HELPERS

function handleBlockedContinue() {
  if (!G.gameStarted) return;
  if (G.vignetteClosing) return;
  if (G.inputMode) {
    submitInput();
    return;
  }
  if (needsWhatsApp()) {
    setModule('personal');
    return;
  }
  if (G.toolPending) {
    setModule('map');
    return;
  }
  if (G.dispatchMode) {
    setModule('dispatch');
    return;
  }
  if (G.waitingChoice && G.pendingChoice) {
    const first = document.getElementById('bc1');
    if (first && !first.disabled) {
      first.classList.add('live');
      setTimeout(() => first.classList.remove('live'), 260);
    }
    return;
  }
  if (G.vignetteOpen || G.vignettePending || document.querySelector('#vignette-overlay.vgn-visible')) {
    vgnContinue();
    return;
  }
  advance();
}

/**
 * SINGLE ENTRYPOINT — All "advance experience" actions MUST route through here.
 *
 * Registered callers (keep this list up-to-date):
 *   • #btn-continue        onclick="triggerPrimaryAction('click')"
 *   • #vgn-continue-btn    onclick="triggerPrimaryAction('click')"
 *   • keydown Space / Enter  → triggerPrimaryAction('kbd-primary')
 *
 * ARCHITECTURE RULE
 *   Do NOT call advance(), vgnContinue(), or submitInput() directly from any
 *   UI element or keyboard shortcut.  Every new "continue" path must go through
 *   triggerPrimaryAction() so the 90 ms debounce (G.primaryActionAt) and the
 *   state-routing gate (handleBlockedContinue) apply uniformly to all inputs.
 *   A parallel call path will break the click/keyboard parity guarantee and may
 *   cause double-fire or missed vignette-close events.
 *
 * Regression test: scripts/test_input_regression.py
 *
 * @param {string} source  'click' | 'kbd-primary'  (informational / for debugging)
 */
function triggerPrimaryAction(source) {
  const now = Date.now();
  if (now - (G.primaryActionAt || 0) < 90) return;
  G.primaryActionAt = now;
  if (G.inputMode) {
    submitInput();
    return;
  }
  handleBlockedContinue();
}

function needsWhatsApp() {
  // Gate applies even during choice — user must read WA before answering Dani
  return isWhatsAppScene() && G.personalUnread > 0 &&
         G.currentModule !== 'personal';
}

function setModule(mod) {
  G.currentModule = mod;
  if (mod === 'chat')     { G.emergencyUnread = 0; G.pending911 = false; hideToast(); }
  if (mod === 'personal') {
    const ac = G.waContacts[G.waActive];
    if (ac) { G.personalUnread = Math.max(0, G.personalUnread - ac.unread); ac.unread = 0; }
    else G.personalUnread = 0;
  }
  if (mod === 'map')      { G.mapUnread = 0; }
  if (mod === 'dispatch') { G.dispatchUnread = 0; }
  refreshUI();
}

function goTo911() { hideToast(); setModule('chat'); }

function addNarr(cls, text) {
  const feed = document.getElementById('narr-feed');
  const el = document.createElement('div');
  el.className = cls; el.textContent = text;
  feed.appendChild(el);
  feed.scrollTop = feed.scrollHeight;
  G.narrationLog.push({ cls, text });
  if (G.narrationLog.length > 200) G.narrationLog.shift();
}

function cueOnce(key, cls, text) {
  const scoped = G.currentSceneId + ':' + key;
  if (G.cuesSeen.has(scoped)) return;
  G.cuesSeen.add(scoped);
  addNarr(cls, text);
}

let toastTimer = null;
function showToast(speaker, text) {
  document.getElementById('toast-text').textContent = speaker + ': ' + text;
  document.getElementById('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 7000);
}
function hideToast() { document.getElementById('toast').classList.remove('show'); clearTimeout(toastTimer); }

function doFade(cb) {
  const f = document.getElementById('fade');
  f.classList.add('on');
  setTimeout(() => { f.classList.remove('on'); cb && cb(); }, 360);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// KEYBOARD
// ═══════════════════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') {
    if (e.key === 'Enter' && G.inputMode) {
      e.preventDefault();
      e.stopPropagation();
      triggerPrimaryAction('kbd-enter-input');
    }
    return;
  }
  if (e.key === ' ' || e.key === 'Enter') {
    if (e.repeat) return;
    e.preventDefault();
    triggerPrimaryAction('kbd-primary');
    return;
  }
  if (e.key === '1')     { G.waitingChoice ? resolveChoice(0) : (G.currentModule==='manual' ? prevCat() : null); }
  if (e.key === '2')     { G.waitingChoice ? resolveChoice(1) : (G.currentModule==='manual' ? nextCat() : null); }
  if (e.key==='c'||e.key==='C') setModule('chat');
  if (e.key==='m'||e.key==='M') setModule('manual');
  if (e.key==='p'||e.key==='P') setModule('map');
  if (e.key==='d'||e.key==='D') setModule('dispatch');
  if (e.key==='w'||e.key==='W') setModule('personal');
  if (e.key==='r'||e.key==='R') location.reload();
  if (e.key==='f'||e.key==='F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

// AUDIO ENGINE  (usa archivos reales de assets/)
// ═══════════════════════════════════════════════════════════════════════════
const AUDIO = (() => {
  let _muted = false;
  let _musicAudio = null;
  let _musicKey = null;
  let _musicToken = 0;
  const _activeSfx = new Set();

  function _playMusicIfPossible(token) {
    if (_muted || !_musicAudio || token !== _musicToken) return;
    const p = _musicAudio.play();
    if (p && typeof p.catch === 'function') p.catch(() => {});
  }

  function sfxSrc(name) {
    return ((ASSET_DATA.audio || {}).sfx || {})[name];
  }

  function musicSrc(name) {
    return ((ASSET_DATA.audio || {}).music || {})[name];
  }

  function sfx(name, options = {}) {
    const replace = !!(options && options.replace);
    if (replace) _stopSfx();
    if (_muted) return;
    const src = sfxSrc(name);
    if (!src) return;
    try {
      const a = new Audio(src);
      a.volume = 0.55;
      a.dataset = a.dataset || {};
      a.dataset.sfxKey = name;
      _activeSfx.add(a);
      a.addEventListener('ended', () => _activeSfx.delete(a), { once: true });
      a.addEventListener('error', () => _activeSfx.delete(a), { once: true });
      a.play().catch(() => {});
    } catch(e) {}
  }

  function replaceSfx(name) {
    sfx(name, { replace: true });
  }

  function _stopSfx() {
    for (const a of _activeSfx) {
      try { a.pause(); a.currentTime = 0; } catch(e) {}
    }
    _activeSfx.clear();
  }

  function _stopMusic(clearKey) {
    _musicToken++;
    if (_musicAudio) {
      try {
        _musicAudio.pause();
        _musicAudio.removeAttribute('src');
        _musicAudio.load();
      } catch(e) {}
      _musicAudio = null;
    }
    if (clearKey) _musicKey = null;
  }

  function stopAmbient() {
    _stopMusic(true);
  }

  function stopSfx() {
    _stopSfx();
  }

  function startAmbient(name) {
    const nextKey = name || null;
    if (!nextKey) {
      _stopMusic(true);
      return;
    }
    if (_musicAudio && _musicKey === nextKey) {
      _playMusicIfPossible(_musicToken);
      return;
    }
    _musicKey = nextKey;
    _stopMusic(false);
    if (_muted) return;
    const src = musicSrc(_musicKey);
    if (!src) return;
    try {
      const token = ++_musicToken;
      _musicAudio = new Audio(src);
      _musicAudio.loop = true;
      _musicAudio.volume = 0.22;
      _playMusicIfPossible(token);
    } catch(e) {}
  }

  function toggleMute() {
    _muted = !_muted;
    if (_muted) {
      _stopSfx();
      _stopMusic(false);
    } else if (_musicKey) {
      // Resume the last configured music after unmute.
      startAmbient(_musicKey);
    }
    const b = document.getElementById('sound-btn');
    if (b) b.textContent = _muted ? '🔇' : '🔊';
    return _muted;
  }

  document.addEventListener('visibilitychange', () => {
    if (!_muted && !document.hidden && _musicKey) {
      startAmbient(_musicKey);
    }
  });

  function state() {
    return {
      muted: _muted,
      ambientKey: _musicKey,
      ambientActive: !!_musicAudio,
      ambientPaused: !!(_musicAudio && _musicAudio.paused),
      activeSfx: _activeSfx.size,
      activeSfxKeys: Array.from(new Set(Array.from(_activeSfx).map(a => a.dataset?.sfxKey).filter(Boolean))),
    };
  }

  return { sfx, replaceSfx, stopSfx, startAmbient, stopAmbient, toggleMute, state };
})();

function resolveImageAssetPath(path) {
  const p = String(path || '').trim();

  // Legacy compatibility: project data still stores assets/images but runtime files live in assets/vignettes.
  return p.startsWith('assets/images/') ? p.replace('assets/images/', 'assets/vignettes/') : p;

function imageTagWithLegacyFallback(path, fit) {
  const src = resolveImageAssetPath(path);
  if (!src) return '';
  const fallback = src.startsWith('assets/vignettes/')
    ? src.replace('assets/vignettes/', 'assets/images/')
    : src;
  const safeSrc = escAttr(src);
  const safeFallback = escAttr(fallback);
  const objectFit = fit || 'contain';
  return `<img src="${safeSrc}" style="width:100%;height:100%;object-fit:${objectFit}" alt="" onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb='';}else{this.style.display='none';}" data-fb="${safeFallback}">`;
}
