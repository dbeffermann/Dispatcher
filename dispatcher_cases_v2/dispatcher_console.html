  if (_vgnTimer) { clearTimeout(_vgnTimer); _vgnTimer = null; }

  // Background
  document.getElementById('vgn-bg').style.background = d.bg || '#000';
  // Image / art
  const img = d.image || IMG_ARTS[scene];
  document.getElementById('vgn-art').innerHTML = img
    ? imageTagWithLegacyFallback(img, 'contain')
    : (d.art || vignetteFallbackHtml(scene));
  // Label + caption
  document.getElementById('vgn-label').textContent = d.label || '';
  const subEl = document.getElementById('vgn-subtitle');
  subEl.textContent   = d.subtitle || '';
  subEl.style.opacity = '1';

  // Continue button — disabled until min_duration_ms elapses
  const minMs = extraOpts.min_duration_ms || d.min_duration_ms || 0;
  const btn   = document.getElementById('vgn-continue-btn');
  if (btn) btn.disabled = minMs > 0;

  // Progress bar
  const prog = document.getElementById('vgn-progress');
  if (prog) { prog.style.transition = 'none'; prog.style.width = '0'; }

  _vgnDone = onDone;
  el.style.display = 'flex';
  el.offsetHeight;
  el.classList.add('vgn-visible');

  if (minMs > 0) {
    requestAnimationFrame(() => {
      if (prog) {
        prog.style.transition = 'width ' + minMs + 'ms linear';
        prog.style.width = '100%';
      }
    });
    setTimeout(() => {
      if (btn) btn.disabled = false;
      if (prog) { prog.style.transition = 'none'; prog.style.width = '0'; }
    }, minMs);
  }
}

// Called by the overlay CONTINUAR button (and keyboard Enter/Space when overlay visible)
function vgnContinue() {
  const btn = document.getElementById('vgn-continue-btn');
  if (btn && btn.disabled) return;
  if (G.vignetteOpen) {
    // Peek at the next beat to decide whether to keep the overlay open.
    // Visual vignette beats and audio side-effects keep the same active overlay;
    // only non-vignette narrative beats should close it first.
    const beats     = G.currentScene.beats || [];
    const upcoming  = G.injectedBeats.length > 0 ? G.injectedBeats[0] : beats[G.beatIndex];
    const nextIsVigSeq = upcoming && upcoming.kind === 'vignette' &&
               (upcoming.action === 'open' || upcoming.action === 'text' || upcoming.action === 'change' || upcoming.action === 'close');
    const nextIsAudioSideEffect = upcoming && (upcoming.kind === 'sfx' || upcoming.kind === 'ambient');
    if (nextIsVigSeq || nextIsAudioSideEffect) {
      // Next beat is still part of this vignette sequence — advance in place
      advance();
    } else {
      // No more vignette beats ahead — close overlay, then resume narrative
      G.vignetteClosing = true;
      G.vignetteOpen    = false;
      G.vignettePending = false;
      refreshUI();
      _vgnClose();
      setTimeout(() => {
        G.vignetteClosing = false;
        refreshUI();
      }, 620); // after the 580 ms fade-out + margin
    }
  } else {
    // Simple vignette (no action field): close overlay and run done callback
    _vgnClose();
  }
}

function _vgnClose() {
  const el = document.getElementById('vignette-overlay');
  if (!el) return;
  // Disable the vignette button immediately so it cannot be clicked during the
  // 580 ms fade-out (pointer-events:auto is set on the button via CSS).
  const vgnBtn = document.getElementById('vgn-continue-btn');
  if (vgnBtn) { vgnBtn.disabled = true; vgnBtn.style.pointerEvents = 'none'; }
  el.classList.remove('vgn-visible');
  setTimeout(() => {
    el.style.display = 'none';
    if (vgnBtn) { vgnBtn.disabled = false; vgnBtn.style.pointerEvents = ''; }
    const cb = _vgnDone; _vgnDone = null;
    if (cb) cb();
  }, 580);
}

// ── Dynamic vignette helpers ──────────────────────────────────────────────
function _vignetteResolveAsset(scene) {
  const ext = ((ASSET_DATA.vignettes || {})[scene]) || {};
  const fb  = VIGNETTE_DEFS[scene] || {};
  const d   = { ...fb, ...ext };
  return {
    img: resolveImageAssetPath(d.image || IMG_ARTS[scene] || ''),
    bg: d.bg || 'rgba(0,0,0,.92)',
    label: d.label || (scene ? String(scene).replace(/_/g, ' ') : ''),
    subtitle: d.subtitle || '',
    blackSlate: String(scene || '').toLowerCase() === 'negro'
  };
}

function _vignetteOpenShot(scene, text) {
  const el  = document.getElementById('vignette-overlay');
  if (!el) return;
  if (_vgnTimer) { clearTimeout(_vgnTimer); _vgnTimer = null; }
  const { img, bg, label, subtitle, blackSlate } = _vignetteResolveAsset(scene);
  document.getElementById('vgn-bg').style.background = bg;
  const art = document.getElementById('vgn-art');
  art.style.transition = '';
  art.style.opacity    = '1';
  art.style.background = '#000';
  art.innerHTML = blackSlate
    ? vignetteBlackSlateHtml(text || subtitle || label || 'EN NEGRO')
    : (img
      ? imageTagWithLegacyFallback(img, 'contain')
      : vignetteFallbackHtml(scene));
  document.getElementById('vgn-label').textContent = label;
  const subEl = document.getElementById('vgn-subtitle');
  subEl.textContent   = text || subtitle;
  subEl.style.opacity = '1';
  const btn = document.getElementById('vgn-continue-btn');
  if (btn) btn.disabled = false;
  el.style.display = 'flex';
  el.offsetHeight;
  el.classList.add('vgn-visible');
}

function _vignetteUpdateText(text) {
  const sub = document.getElementById('vgn-subtitle');
  if (!sub) return;
  sub.style.transition = 'opacity .25s';
  sub.style.opacity    = '0';
  setTimeout(() => { sub.textContent = text; sub.style.opacity = '1'; }, 260);
}

function _vignetteChangeShot(scene, text) {
  const art = document.getElementById('vgn-art');
  if (!art) return;
  art.style.transition = 'opacity .35s';
  art.style.opacity    = '0';
  setTimeout(() => {
    const { img, bg, label, subtitle, blackSlate } = _vignetteResolveAsset(scene);
    document.getElementById('vgn-bg').style.background = bg;
    document.getElementById('vgn-label').textContent = label;
    art.style.background = '#000';
    art.innerHTML = blackSlate
      ? vignetteBlackSlateHtml(text || subtitle || label || 'EN NEGRO')
      : (img
        ? imageTagWithLegacyFallback(img, 'contain')
        : vignetteFallbackHtml(scene));
    art.style.opacity = '1';
    _vignetteUpdateText(text || subtitle);
  }, 370);
}

function _vignetteClose() {
  _vgnClose();
}

function showCinematic() {
  const el  = document.getElementById('cinema-overlay');
  const art = document.getElementById('cinema-art');
  const c = ASSET_DATA.cinema || {};
  if (!el) return;
  if (art) {
    art.innerHTML = c.image
      ? imageTagWithLegacyFallback(c.image, 'cover')
      : _cinemaArt();
  }
  const sub = document.querySelector('.cinema-sub');
  const title = document.querySelector('.cinema-title');
  const place = document.querySelector('.cinema-place');
  const txt = document.querySelector('.cinema-text');
  if (sub && c.studio) sub.textContent = c.studio;
  if (title && c.title) title.textContent = c.title;
  if (place && c.place) place.textContent = c.place;
  if (txt && c.text) txt.innerHTML = c.text;
  el.style.transition = '';
  el.style.opacity    = '1';
  el.style.display    = 'flex';
}

function closeCinematic() {
  const el = document.getElementById('cinema-overlay');
  if (!el) return;
  el.style.transition = 'opacity .7s';
  el.style.opacity    = '0';
  setTimeout(() => { el.style.display = 'none'; }, 720);
}

// ── WA CONTACTS INIT ──────────────────────────────────────────────────────
function initWA() {
  const contacts = ASSET_DATA.contacts || {
    dani: { name: 'Dani', avatar: 'D', color: '#25d366', status: 'en línea' }
  };
  G.waContacts = {};
  for (const [id, c] of Object.entries(contacts)) {
    G.waContacts[id] = {
      name: c.name || id,
      avatar: c.avatar || (c.name || id).slice(0,1).toUpperCase(),
      color: c.color || '#25d366',
      status: c.status || '',
      messages: id === 'dani' ? G.personalFeed : (c.messages || []),
      unread: c.unread || 0
    };
  }
  G.waActive = (ASSET_DATA.whatsapp && ASSET_DATA.whatsapp.default_contact) || Object.keys(G.waContacts)[0] || 'dani';
}
